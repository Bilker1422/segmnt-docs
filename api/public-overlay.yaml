overlay: 1.1.0
info:
  title: Hide internal and admin endpoints from the public reference
  version: 1.0.0
extends: ./openapi.yaml
actions:
  - target: $.paths['/v1/admin/bans']
    remove: true
  - target: $.paths['/v1/admin/bans/{banId}/lift']
    remove: true
  - target: $.paths['/v1/billing/providers/{provider}/webhook']
    remove: true
  - target: $.paths['/v1/internal/block']
    remove: true
  - target: $.paths['/v1/internal/security-events']
    remove: true
  - target: $.paths['/v1/internal/billing/overage']
    remove: true
  - target: $.paths['/v1/admin/overview']
    remove: true
  - target: $.paths['/v1/admin/scan']
    remove: true
  - target: $.paths['/v1/admin/alerts']
    remove: true
  - target: $.paths['/v1/admin/alerts/{alertId}/ack']
    remove: true
  - target: $.paths['/v1/admin/accounts']
    remove: true
  - target: $.paths['/v1/admin/accounts/{accountId}']
    remove: true
  - target: $.paths['/v1/admin/accounts/{accountId}/review']
    remove: true
  - target: $.paths['/v1/admin/accounts/{accountId}/ban-proposal']
    remove: true
  - target: $.paths['/v1/admin/videos']
    remove: true
  - target: $.paths['/v1/admin/videos/{videoId}']
    remove: true
  - target: $.paths['/v1/admin/videos/{videoId}/hold']
    remove: true
  - target: $.paths['/v1/admin/videos/{videoId}/unhold']
    remove: true
  - target: $.paths['/v1/admin/videos/{videoId}/frames/{name}']
    remove: true
  - target: $.paths['/v1/admin/moderation']
    remove: true
  - target: $.paths['/v1/admin/moderation/scan']
    remove: true
  - target: $.tags[10]
    remove: true
  # Per-video public access mode is not released yet: no release tag contains
  # it, and the current production release has no accessMode. Hide it from the
  # published reference until it ships. The pages that describe it carry the
  # "Coming soon" label.
  - target: $.paths['/v1/projects/{projectId}/videos/{videoId}'].patch.requestBody.content['application/json'].schema.properties.accessMode
    remove: true
  - target: $.paths['/v1/projects/{projectId}/videos/{videoId}'].patch.description
    update: |
      Rename the video. Provide `title`.
  - target: $.paths['/v1/projects/{projectId}/videos/{videoId}/playback-tokens'].post.description
    update: |
      Call this from your server each time you show the video to a viewer.
      The token is signed (HMAC) and holds the video ID, the expiry and the
      allowed domain. The CDN refuses requests whose `Origin` or `Referer` is
      another domain, and refuses a token whose video ID is another video.
  - target: $.components.schemas.Video.properties.accessMode
    remove: true
  - target: $.components.schemas.Video.required[?(@ == 'accessMode')]
    remove: true
  - target: $.components.schemas.VideoAccessMode
    remove: true
  # Viewer network (IP) binding is built and runs in production, but it is not
  # offered publicly yet (YAH-995 / YAH-1002; wording fix YAH-1084): the pages
  # carry the "Coming soon" label, and the fields stay hidden from the published
  # reference until the CTO opens the public claim. The PATCH project and the
  # playback-token request bodies use `$ref` schemas, so the fields are removed
  # on the component that defines them.
  - target: $.components.schemas.Project.properties.ipBinding
    remove: true
  - target: $.components.schemas.Project.required[?(@ == 'ipBinding')]
    remove: true
  - target: $.components.schemas.ProjectUpdateInput.properties.ipBinding
    remove: true
  - target: $.components.schemas.PlaybackTokenInput.properties.viewerIp
    remove: true
  # The description still advertised network binding after the field was hidden
  # (same leak the accessMode precedent closed by rewriting the video PATCH
  # description).
  - target: $.components.schemas.ProjectUpdateInput.description
    update: |
      Rename a project and/or update its white-label branding. At least one field is required.
  # Webhook secret rotation, the delivery log and the send-test-event call are
  # built but not in a production release yet (YAH-1050). The Webhooks guide
  # carries the "Coming soon" label, and the unreleased routes are hidden from
  # the published reference until they ship.
  - target: $.paths['/v1/projects/{projectId}/webhook-endpoints/{endpointId}/rotate-secret']
    remove: true
  - target: $.paths['/v1/projects/{projectId}/webhook-endpoints/{endpointId}/deliveries']
    remove: true
  - target: $.paths['/v1/projects/{projectId}/webhook-endpoints/{endpointId}/test']
    remove: true
