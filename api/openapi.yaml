                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: The account with the proposal recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/videos:
    get:
      tags: [Admin]
      x-excluded: true
      x-internal: true
      operationId: listAdminVideos
      summary: List videos (held, ready, failed)
      security:
        - adminAccess: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/VideoStatus'
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            pattern: '^prj_[A-Za-z0-9]+$'
        - name: accountId
          in: query
          required: false
          schema:
            type: string
            pattern: '^acc_[A-Za-z0-9]+$'
        - name: moderationState
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ModerationState'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Videos, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVideoList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/admin/videos/{videoId}:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    get:
      tags: [Admin]
      x-excluded: true
      x-internal: true
      operationId: getAdminVideo
      summary: Video detail with review frames
      security:
        - adminAccess: []
      responses:
        '200':
          description: The video, its account and the names of its review frames.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVideo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin]
      x-excluded: true
      x-internal: true
      operationId: removeAdminVideo
      summary: Remove a video
      description: Soft delete. The video stops playing within about a minute.
      security:
        - adminAccess: []
      responses:
        '204':
          description: The video is removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/videos/{videoId}/hold:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    post:
      tags: [Admin]
      x-excluded: true
      x-internal: true
      operationId: holdAdminVideo
      summary: Hold a video (it stops playing)
      description: Sets `held` and sends the `video.held` webhook. Idempotent.
      security:
        - adminAccess: []
      responses:
        '200':
          description: The held video.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/videos/{videoId}/unhold:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    post:
      tags: [Admin]
      x-excluded: true
      x-internal: true
      operationId: unholdAdminVideo
      summary: Release a hold (back to ready)
      security:
        - adminAccess: []
      responses:
        '200':
          description: The ready video.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/videos/{videoId}/frames/{name}:
    parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/FrameName'
    get:
      tags: [Admin]
      x-excluded: true
      x-internal: true
      operationId: getAdminVideoFrame
      summary: Fetch one review frame (JPEG)
      description: The frame is private; the admin page fetches it with the admin credential and shows it as a blob.
      security:
        - adminAccess: []
      responses:
        '200':
          description: The JPEG frame.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/moderation:
    get:
      tags: [Admin]
      x-excluded: true
      x-internal: true
      operationId: listAdminModerationQueue
      summary: Human review queue (held and awaiting a check)
      description: |
        Videos that are held or still waiting for a moderation check: a free
        account's first videos (`pending`) and anything the check flagged
        (`flagged`). Oldest first, so nothing sits unlooked-at.
      security:
        - adminAccess: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Videos to review, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVideoList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/admin/moderation/scan:
    post:
      tags: [Admin]
      x-excluded: true
      x-internal: true
      operationId: runModerationScan
      summary: Run the moderation check now
      description: |
        Runs the AI check over the review frames of the videos that still need
        it. Safe to call any time: a video is only checked once. The same scan
        runs on the Worker cron when `MODERATION_PROVIDER` is set.
      security:
        - adminAccess: []
      responses:
        '200':
          description: What the scan did.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationScanResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

webhooks:
  video.ready:
    post:
      tags: [Webhooks]
      operationId: onVideoReady
      summary: All qualities are ready and the video can play
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookReceived'
  video.failed:
    post:
      tags: [Webhooks]
      operationId: onVideoFailed
      summary: Encoding failed
      description: '`data.video.failure` says why.'
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookReceived'
  video.held:
    post:
      tags: [Webhooks]
      operationId: onVideoHeld
      summary: Our team held the video and it does not play
      description: When the hold ends, `video.ready` is sent again.
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookReceived'

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Project API key. Server-side only.
    session:
      type: apiKey
      in: cookie
      name: segmnt_session
      description: Dashboard session cookie, set after SSO sign-in.
    adminAccess:
      type: http
      scheme: bearer
      description: |
        Admin credential (task A12). Either a Cloudflare Access JWT (sent as the
        `Cf-Access-Jwt-Assertion` header when the request passed the Access
        policy) or the TEST `ADMIN_TOKEN` as a bearer token. Never a customer key.
    internalSecret:
      type: http
      scheme: bearer
      description: Shared `USAGE_REPORT_SECRET`. Used only by our own Workers (playback, api).

  parameters:
    AuthProviderId:
      name: provider
      in: path
      required: true
      description: Sign-in provider id, from `GET /auth/providers` (for example `google`).
      schema:
        type: string
        pattern: '^[a-z0-9_-]+$'
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: '^prj_[A-Za-z0-9]+$'
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        pattern: '^acc_[A-Za-z0-9]+$'
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
        pattern: '^alt_[A-Za-z0-9]+$'
    FrameName:
      name: name
      in: path
      required: true
      description: A review frame file name from the video detail (`NNNN.jpg`).
      schema:
        type: string
        pattern: '^[0-9]{4}\.jpg$'
    VideoId:
      name: videoId
      in: path
      required: true
      schema:
        type: string
        pattern: '^vid_[A-Za-z0-9]+$'
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        pattern: '^upl_[A-Za-z0-9]+$'
    DomainId:
      name: domainId
      in: path
      required: true
      schema:
        type: string
        pattern: '^dom_[A-Za-z0-9]+$'
    BanId:
      name: banId
      in: path
      required: true
      schema:
        type: string
        pattern: '^ban_[A-Za-z0-9]+$'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: '`nextCursor` from the previous page.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Any unique string. A retry with the same key within 24 hours returns the first result.
      schema:
        type: string
        maxLength: 255
    WebhookSignature:
      name: Segmnt-Signature
      in: header
      required: true
      description: |
        `t=<unix seconds>,v1=<hex HMAC-SHA256>`. The HMAC is over `<t>.<raw body>`
        with the endpoint's signing secret. `t` is the time of this delivery
        attempt (each retry is signed again), so refuse a `t` older than 5 minutes.
      schema:
        type: string
        examples: ['t=1791648000,v1=5f2b...']

  responses:
    AuthNotConfigured:
      description: Sign-in is not configured in this environment (`code` is `not_configured`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request is not valid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or wrong API key or session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not allowed, for example a plan limit (`code` is `plan_limit_reached`) or a domain that is not verified (`domain_not_verified`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found, or not in a project this key or session can use.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The resource is in the wrong state, for example a video that is not `ready` yet.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit reached. Wait for `Retry-After` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WebhookReceived:
      description: |
        Return any 2xx within 10 seconds. Other answers are retried with backoff
        for up to 24 hours. Events can arrive more than once and out of order:
        use `id` to skip duplicates, and ignore an event whose
        `data.video.updatedAt` is older than the one you have (or call
        `GET` video for the current state).

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable error code for programs.
          examples: [plan_limit_reached]
        detail:
          type: string

    Timestamp:
      type: string
      format: date-time

    AuthProvider:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          description: Provider id, used in the `/auth/{provider}/...` routes.
          examples: [google]
        label:
          type: string
          description: Human-readable name for the sign-in button.
          examples: [Google]

    Me:
      type: object
      required: [user, account]
      properties:
        user:
          type: object
          required: [id, role]
          properties:
            id:
              type: string
              examples: [usr_9fK2mQ]
            email:
              type: [string, 'null']
              description: Only set when a provider verified it.
            displayName:
              type: [string, 'null']
            role:
              type: string
              description: The user's role in the account. The MVP has `owner`.
              examples: [owner]
        account:
          type: object
          required: [id, name, planId, planStatus, createdAt]
          properties:
            id:
              type: string
              examples: [acc_5bT8qL]
            name:
              type: string
            planId:
              type: string
              description: Current plan. The MVP has `free`; billing (A9) adds paid plans.
              examples: [free]
            planStatus:
              type: string
              enum: [active, pilot, past_due, canceled]
            createdAt:
              $ref: '#/components/schemas/Timestamp'
            phoneVerified:
              type: boolean
              description: |
                True once a phone number is verified (task A13). Free accounts
                must verify one before their first upload.
            phoneVerificationRequired:
              type: boolean
              description: |
                True when this account must verify a phone before it can upload
                (a new free account that has not verified yet).

    PhoneStartInput:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: A Saudi or GCC mobile number. Stored only as a salted hash.
          examples: ['0512345678', '+966512345678', '+971501234567']
        country:
          type: string
          enum: [sa, ae, kw, qa, bh, om]
          description: |
            Country of a local `phone` (for example `ae` for `0501234567`).
            Ignored when `phone` starts with a country code. Defaults to `sa`.

    PhoneChallenge:
      type: object
      required: [challengeId, phone, expiresAt]
      properties:
        challengeId:
          type: string
          examples: [phc_8fK2mQ]
        phone:
          type: string
          description: The number with its middle digits masked.
          examples: ['+96651****678']
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        testCode:
          type: string
          description: |
            Present ONLY in the TEST environment (`TEST_SINK=1`), so the
            automated end-to-end test can finish the flow without a real SMS.
            Never present in production.

    PhoneVerifyInput:
      type: object
      required: [challengeId, code, fingerprint]
      properties:
        challengeId:
          type: string
          examples: [phc_8fK2mQ]
        code:
          type: string
          pattern: '^\d{6}$'
          examples: ['123456']
        fingerprint:
          type: string
          maxLength: 256
          description: A stable identifier for the browser/device, stored only as a salted hash.

    PhoneVerified:
      type: object
      required: [phoneVerified, phoneVerifiedAt]
      properties:
        phoneVerified:
          type: boolean
        phoneVerifiedAt:
          $ref: '#/components/schemas/Timestamp'

    BanInput:
      type: object
      required: [reason, boardApprovalRef]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        boardApprovalRef:
          type: string
          minLength: 1
          description: Reference to the board approval. A ban cannot be written without it.
          examples: ['APPR-42']
        accountId:
          type: string
          examples: [acc_5bT8qL]
        phone:
          type: string
          description: Saudi or GCC mobile number, stored only as a salted hash (use a country code for a non-Saudi number).
        fingerprint:
          type: string
          maxLength: 256
          description: Device fingerprint, stored only as a salted hash.

    Ban:
      type: object
      required: [id, reason, boardApprovalRef, status, createdAt]
      properties:
        id:
          type: string
          examples: [ban_3kQ8mZ]
        accountId:
          type: [string, 'null']
        hasPhone:
          type: boolean
          description: True when the ban names a phone number (the value itself is never returned).
        hasFingerprint:
          type: boolean
          description: True when the ban names a device fingerprint (the value itself is never returned).
        reason:
          type: string
        boardApprovalRef:
          type: string
        status:
          type: string
          enum: [active, lifted]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        liftedAt:
          type: [string, 'null']
          format: date-time

    BanList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ban'

    Project:
      type: object
      required: [id, name, createdAt, whiteLabel, branding]
      properties:
        id:
          type: string
          examples: [prj_8fK2mQ]
        name:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        whiteLabel:
          type: boolean
          readOnly: true
          description: |
            True when the account's plan may hide our logo and brand the player
            (a paid feature; free plans always show our logo).
        branding:
          $ref: '#/components/schemas/ProjectBranding'
    ProjectBranding:
      type: object
      required: [hideLogo, primaryColor, logoUrl]
      description: White-label player branding. Paid plans only (free plans always show our logo).
      properties:
        hideLogo:
          type: boolean
          default: false
          description: Hide the segmnt badge on the player.
        primaryColor:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          default: '#0B5D42'
          examples: ['#0B5D42']
          description: Player primary colour (accent).
        logoUrl:
          type: [string, 'null']
          description: |
            Customer logo shown instead of ours, or null. Must be an
            `https://` URL (up to 2048 characters); an `http://` URL is
            rejected and reads back as null.
    ProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples: [Client A courses]
    ProjectUpdateInput:
      type: object
      minProperties: 1
      description: Rename a project and/or update its white-label branding. At least one field is required.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples: [Client A courses]
        branding:
          type: object
          minProperties: 1
          description: |
            Partial branding update. Setting branding on a plan without
            `whiteLabel` returns `403 plan_limit_reached`.
          properties:
            hideLogo:
              type: boolean
            primaryColor:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
            logoUrl:
              type: [string, 'null']
              description: |
                Customer logo URL. Must be an `https://` URL (up to 2048
                characters), or null to clear it. An `http://` URL is
                rejected with `400 invalid_request`.
    ProjectList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        nextCursor:
          type: [string, 'null']

    ApiKey:
      type: object
      required: [id, name, prefix, createdAt, lastUsedAt]
      properties:
        id:
          type: string
          examples: [key_3hT9aZ]
        name:
          type: string
        prefix:
          type: string
          description: First characters of the key, to recognise it.
          examples: [Abcd1234]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          description: |
            When the key was last used. Updated at most once a minute, so it can lag
            real use by up to 60 seconds; `null` means the key has never been used.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    ApiKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: |
                The full key: `sk_{prefix}_{secret}` (docs/architecture.md section 9).
                Shown only in this response; we store only the SHA-256 of the secret.

    Domain:
      type: object
      required: [id, hostname, status, verification, createdAt, verifiedAt]
      properties:
        id:
          type: string
          examples: [dom_7pW1cX]
        hostname:
          type: string
          description: |
            Lowercase hostname. Playback matches this exact host only (see
            Playback in the API description); a subdomain needs its own domain.
          examples: [courses.example.com]
        status:
          type: string
          enum: [pending, verified]
        verification:
          type: object
          description: Create this DNS record to prove you own the domain.
          required: [type, name, value]
          properties:
            type:
              type: string
              const: TXT
            name:
              type: string
              examples: [_segmnt-verify.courses.example.com]
            value:
              type: string
              examples: [segmnt-verify=b41c09e2f7a3d6c1]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        verifiedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    UploadInput:
      type: object
      required: [title, fileName, sizeBytes, contentType]
      properties:
        title:
          $ref: '#/components/schemas/VideoTitle'
        fileName:
          type: string
          maxLength: 255
          examples: [lesson-01.mp4]
        sizeBytes:
          type: integer
          minimum: 1
          description: File size. The plan sets the maximum.
          examples: [2147483648]
        contentType:
          type: string
          enum: [video/mp4, video/quicktime, video/webm, video/x-matroska]
    Upload:
      type: object
      required: [id, video, partSizeBytes, parts, expiresAt]
      properties:
        id:
          type: string
          examples: [upl_2bN6rD]
        video:
          $ref: '#/components/schemas/Video'
        partSizeBytes:
          type: integer
          description: Size of every part except the last one.
          examples: [104857600]
        parts:
          type: array
          items:
            type: object
            required: [partNumber, url]
            properties:
              partNumber:
                type: integer
                minimum: 1
              url:
                type: string
                format: uri
                description: Pre-signed `PUT` URL for this part. Do not log it.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'

    VideoTitle:
      type: string
      minLength: 1
      maxLength: 200
      examples: [Lesson 1 - Introduction]
    VideoStatus:
      type: string
      enum: [uploading, processing, ready, failed, held]
      description: |
        - `uploading`: waiting for the parts and the complete call.
        - `processing`: encoding to HLS.
        - `ready`: can play.
        - `failed`: encoding failed; see `failure`.
        - `held`: held by our team; does not play.
    Quality:
      type: string
      enum: ['360p', '720p', '1080p', '1440p', '2160p']
      description: 1440p and 2160p only on paid plans, and never above the source.
    Video:
      type: object
      required: [id, projectId, title, status, durationSeconds, qualities, sizeBytes, failure, createdAt, updatedAt, readyAt]
      properties:
        id:
          type: string
          examples: [vid_9xR4tL]
        projectId:
          type: string
        title:
          $ref: '#/components/schemas/VideoTitle'
        status:
          $ref: '#/components/schemas/VideoStatus'
        durationSeconds:
          type: [number, 'null']
          description: Known after encoding.
        qualities:
          type: array
          description: Qualities that can play. Empty until `ready`.
          items:
            $ref: '#/components/schemas/Quality'
        sizeBytes:
          type: integer
          description: Size of the original file.
        failure:
          description: Set only when `status` is `failed`.
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                  examples: [unsupported_codec]
                message:
                  type: string
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        readyAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    VideoList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Video'
        nextCursor:
          type: [string, 'null']

    PlaybackTokenInput:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
          format: hostname
          description: A verified domain of the project, where the player runs.
          examples: [courses.example.com]
        expiresInSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 14400
          description: Make it longer than the video so playback does not stop.
    PlaybackToken:
      type: object
      required: [token, expiresAt, embedUrl, thumbnailUrl]
      properties:
        token:
          type: string
          description: Opaque. Do not parse it; the format can change.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        playlistUrl:
          type: string
          format: uri
          description: |
            HLS master playlist for your own player (hls.js or Safari). Only on
            plans with `whiteLabel`; other plans must use `embedUrl`, which shows
            our logo. The CDN adds the token to every link inside the playlists.
          examples: ['https://test-cdn.segmnt.cloud/v/vid_9xR4tL/master.m3u8?token=...']
        embedUrl:
          type: string
          format: uri
          description: Our player (hls.js) for an iframe on the token's domain. Shows our logo unless the plan has `whiteLabel`.
        thumbnailUrl:
          type: string
          format: uri

    WebhookEventType:
      type: string
      enum: [video.ready, video.failed, video.held]
    WebhookEndpoint:
      type: object
      required: [id, url, events, createdAt]
      properties:
        id:
          type: string
          examples: [whe_5mJ8kV]
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    WebhookEndpointWithSecret:
      allOf:
        - $ref: '#/components/schemas/WebhookEndpoint'
        - type: object
          required: [signingSecret]
          properties:
            signingSecret:
              type: string
              description: Use it to check `Segmnt-Signature`.
    WebhookEvent:
      type: object
      required: [id, type, createdAt, projectId, data]
      properties:
        id:
          type: string
          description: Same for every retry of this event.
          examples: [evt_1qA7zP]
        type:
          $ref: '#/components/schemas/WebhookEventType'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        projectId:
          type: string
        data:
          type: object
          required: [video]
          properties:
            video:
              $ref: '#/components/schemas/Video'

    ProjectUsage:
      type: object
      required: [projectId, from, to, storedSeconds, watchedMinutes]
      properties:
        projectId:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        storedSeconds:
          type: integer
          description: |
            Total stored length of the project's videos, weighted by quality
            (1 h of 1440p counts as 2 h, 1 h of 4K counts as 4 h), which is what
            counts against the plan's stored-hours limit.
        watchedMinutes:
          type: integer
          description: Minutes watched by viewers in the period.

    PlanId:
      type: string
      description: Plan names and prices are set by the board. Examples are not real plans.
      examples: [free]
    PlanLimits:
      type: object
      required: [storedSeconds, uploadSecondsPerPeriod, watchedMinutesPerPeriod, verifiedDomains, projects, maxQuality, whiteLabel]
      description: '`null` means no limit.'
      properties:
        storedSeconds:
          type: [integer, 'null']
        uploadSecondsPerPeriod:
          type: [integer, 'null']
          description: New seconds uploaded per period (per month; over the whole window for a pilot).
        watchedMinutesPerPeriod:
          type: [integer, 'null']
        verifiedDomains:
          type: [integer, 'null']
        projects:
          type: [integer, 'null']
          description: Projects the account may have.
        maxQuality:
          $ref: '#/components/schemas/Quality'
        whiteLabel:
          type: boolean
          description: Can hide our logo and brand the player.
    Plan:
      type: object
      required: [id, name, price, limits]
      properties:
        id:
          $ref: '#/components/schemas/PlanId'
        name:
          type: string
        price:
          type: object
          required: [amount, currency, interval]
          description: Before VAT. VAT (15% in Saudi Arabia) is added at checkout when billing VAT mode is on.
          properties:
            amount:
              type: integer
              minimum: 0
              description: Smallest currency unit (halalas for SAR).
            currency:
              type: string
              examples: [SAR]
            interval:
              type: string
              enum: [month, year]
        limits:
          $ref: '#/components/schemas/PlanLimits'
    AccountPlan:
      type: object
      required: [plan, status, currentPeriod, limits, usage]
      properties:
        plan:
          type: object
          required: [id, name]
          properties:
            id:
              $ref: '#/components/schemas/PlanId'
            name:
              type: string
        status:
          type: string
          enum: [active, pilot, past_due, canceled]
        currentPeriod:
          type: object
          required: [start, end]
          properties:
            start:
              $ref: '#/components/schemas/Timestamp'
            end:
              $ref: '#/components/schemas/Timestamp'
        limits:
          $ref: '#/components/schemas/PlanLimits'
        usage:
          type: object
          description: Totals for all projects in the account in the current period.
          required: [storedSeconds, watchedMinutes, verifiedDomains]
          properties:
            storedSeconds:
              type: integer
            watchedMinutes:
              type: integer
            verifiedDomains:
              type: integer
    Checkout:
      type: object
      required: [id, checkoutUrl, expiresAt]
      properties:
        id:
          type: string
        checkoutUrl:
          type: string
          format: uri
          description: Hosted checkout page of the payment provider.
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: When the hosted page stops working. `null` when the provider sets no expiry (Moyasar invoices do not expire by default).

    VideoReportInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 100
          description: Short label, for example `abuse`, `copyright` or `spam`.
        detail:
          type: string
          maxLength: 1000
          description: Optional free text from the reporter.

    VideoReport:
      type: object
      required: [id, videoId, reason]
      properties:
        id:
          type: string
        videoId:
          type: string
        reason:
          type: string

    SecurityEventInput:
      type: object
      required: [eventId, kind]
      properties:
        eventId:
          type: string
          maxLength: 128
          description: Dedupe key. A retried report with the same id is counted once.
        kind:
          type: string
          description: Event type, for example `token_failure`.
        projectId:
          type: [string, 'null']
        videoId:
          type: [string, 'null']
        detail:
          type: [string, 'null']
          maxLength: 500

    Alert:
      type: object
      required: [id, kind, severity, status, summary, createdAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [high_watch_minutes, upload_burst, domain_burst, token_failures, encode_failures, viewer_report, ban_proposed]
        severity:
          type: string
          enum: [info, warning, critical]
        status:
          type: string
          enum: [open, acked]
        accountId:
          type: [string, 'null']
        projectId:
          type: [string, 'null']
        videoId:
          type: [string, 'null']
        summary:
          type: string
        detail:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        ackedAt:
          type: [string, 'null']
          format: date-time

    AlertList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        nextCursor:
          type: [string, 'null']

    AdminOverview:
      type: object
      required: [openAlerts, accountsNew, accountsWatch, videosHeld, videosReady, videosProcessing, videosFailed, reports7d]
      properties:
        openAlerts:
          type: integer
        accountsNew:
          type: integer
        accountsWatch:
          type: integer
        videosHeld:
          type: integer
        videosReady:
          type: integer
        videosProcessing:
          type: integer
        videosFailed:
          type: integer
        reports7d:
          type: integer

    AdminAccount:
      type: object
      required: [id, name, planId, planStatus, reviewFlag, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        planId:
          type: string
        planStatus:
          type: string
        reviewFlag:
          type: string
          enum: [new, ok, watch]
          description: Internal only. Never shown to the customer.
        bannedAt:
          type: [string, 'null']
          format: date-time
        banProposedAt:
          type: [string, 'null']
          format: date-time
        banProposedReason:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    AdminAccountList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccount'
        nextCursor:
          type: [string, 'null']

    AdminAccountDetail:
      type: object
      required: [account, projects, usage]
      properties:
        account:
          $ref: '#/components/schemas/AdminAccount'
        projects:
          type: array
          items:
            type: object
            required: [id, name, createdAt]
            properties:
              id:
                type: string
              name:
                type: string
              createdAt:
                type: string
                format: date-time
              deletedAt:
                type: [string, 'null']
                format: date-time
        usage:
          type: object
          required: [storedSeconds, watchedMinutes]
          properties:
            storedSeconds:
              type: integer
            watchedMinutes:
              type: integer

    AdminVideo:
      allOf:
        - $ref: '#/components/schemas/Video'
        - type: object
          required: [frames, moderationState]
          properties:
            deletedAt:
              type: [string, 'null']
              format: date-time
            accountId:
              type: [string, 'null']
            accountName:
              type: [string, 'null']
            projectName:
              type: [string, 'null']
            moderationState:
              $ref: '#/components/schemas/ModerationState'
            frames:
              type: array
              items:
                type: string
              description: Review frame file names under `frames/{videoId}/`.

    AdminVideoList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminVideoSummary'
        nextCursor:
          type: [string, 'null']

    AdminVideoSummary:
      allOf:
        - $ref: '#/components/schemas/Video'
        - type: object
          required: [accountId, accountName, moderationState]
          properties:
            accountId:
              type: [string, 'null']
              description: The account that owns the video's project.
            accountName:
              type: [string, 'null']
              description: The owning account's name, for the admin list.
            moderationState:
              $ref: '#/components/schemas/ModerationState'

    ModerationState:
      type: string
      enum: [none, pending, cleared, flagged]
      description: |
        Moderation state of a video (A12b). `none`: playable as soon as it is
        `ready` (no check pending). `pending`: held until checked - every one of
        a free account's first videos starts here. `cleared`: checked and
        allowed. `flagged`: the check flagged it; held until a human decides.

    ModerationScanResult:
      type: object
      required: [provider, considered, cleared, flagged, failed]
      properties:
        provider:
          type: [string, 'null']
          description: The provider that ran, or `null` when none is configured.
        considered:
          type: integer
        cleared:
          type: integer
        flagged:
          type: integer
        failed:
          type: integer
