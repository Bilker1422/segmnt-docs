        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/accounts/{accountId}/ban-proposal:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Admin]
      x-excluded: true
      x-internal: true
      operationId: proposeAdminBan
      summary: Propose a ban (needs board approval)
      description: Records the proposal and raises an alert. It never bans an account; a ban runs only after board approval.
      security:
