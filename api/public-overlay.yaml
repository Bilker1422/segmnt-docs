overlay: 1.1.0
info:
  title: Hide internal and admin endpoints from the public reference
  version: 1.0.0
extends: ./openapi.yaml
actions:
  - target: $.paths['/v1/admin/bans']
    remove: true
  - target: $.paths['/v1/admin/bans/{banId}/lift']
    remove: true
  - target: $.paths['/v1/billing/providers/{provider}/webhook']
    remove: true
  - target: $.paths['/v1/internal/block']
    remove: true
  - target: $.paths['/v1/internal/security-events']
    remove: true
  - target: $.paths['/v1/internal/billing/overage']
    remove: true
  - target: $.paths['/v1/admin/overview']
    remove: true
  - target: $.paths['/v1/admin/scan']
    remove: true
  - target: $.paths['/v1/admin/alerts']
    remove: true
  - target: $.paths['/v1/admin/alerts/{alertId}/ack']
    remove: true
  - target: $.paths['/v1/admin/accounts']
    remove: true
  - target: $.paths['/v1/admin/accounts/{accountId}']
    remove: true
  - target: $.paths['/v1/admin/accounts/{accountId}/review']
    remove: true
  - target: $.paths['/v1/admin/accounts/{accountId}/ban-proposal']
    remove: true
  - target: $.paths['/v1/admin/videos']
    remove: true
  - target: $.paths['/v1/admin/videos/{videoId}']
    remove: true
  - target: $.paths['/v1/admin/videos/{videoId}/hold']
    remove: true
  - target: $.paths['/v1/admin/videos/{videoId}/unhold']
    remove: true
  - target: $.paths['/v1/admin/videos/{videoId}/frames/{name}']
    remove: true
  - target: $.paths['/v1/admin/moderation']
    remove: true
  - target: $.paths['/v1/admin/moderation/scan']
    remove: true
  # The device link route is TEST only (YAH-1389): the dashboard links the
  # device after sign-in. It carries `x-excluded` in the spec; the path and its
  # schemas are removed here as well, so the published reference does not
  # describe a route that is not in production yet. The route and the two
  # schemas come back when the device link is released and the CTO marks it
  # Available in the claims register (YAH-876).
  - target: $.paths['/v1/me/device']
    remove: true
  - target: $.components.schemas.DeviceLinkInput
    remove: true
  - target: $.components.schemas.DeviceLink
    remove: true
  # The blocked-account answer of GET /v1/me is TEST only (YAH-1389) and it is
  # not in the release-status list, so it stays out of the published reference
  # until the CTO marks it Available. The 401 answer for a visitor who is not
  # signed in is true in production and stays.
  - target: $.paths['/v1/me'].get.responses['403']
    remove: true
  - target: $.paths['/v1/me'].get.description
    update: |
      Returns the signed-in user and its account. A visitor who is not
      signed in (no session, expired session, signed out) gets
      `401 unauthorized`.
  # Remove the Admin tag by name. This used to be `$.tags[10]`, but two tags
  # (Upload tokens, Demo) were inserted before Admin since, so the index hid
  # Usage instead. Match by name so a future tag insert cannot drift again.
  - target: $.tags[?(@.name == 'Admin')]
    remove: true
  # Per-video public access mode is not released yet: no release tag contains
  # it, and the current production release has no accessMode. Hide it from the
  # published reference until it ships. The pages that describe it carry the
  # "Coming soon" label.
  - target: $.paths['/v1/projects/{projectId}/videos/{videoId}'].patch.requestBody.content['application/json'].schema.properties.accessMode
    remove: true
  - target: $.paths['/v1/projects/{projectId}/videos/{videoId}'].patch.description
    update: |
      Rename the video. Provide `title`.
  - target: $.paths['/v1/projects/{projectId}/videos/{videoId}/playback-tokens'].post.description
    update: |
      Call this from your server each time you show the video to a viewer.
      The token is signed (HMAC) and holds the video ID, the expiry and the
      allowed domain. The CDN refuses requests whose `Origin` or `Referer` is
      another domain, and refuses a token whose video ID is another video.
  - target: $.components.schemas.Video.properties.accessMode
    remove: true
  - target: $.components.schemas.Video.required[?(@ == 'accessMode')]
    remove: true
  - target: $.components.schemas.VideoAccessMode
    remove: true
  # Viewer network (IP) binding is built and runs in production, but it is not
  # offered publicly yet (YAH-995 / YAH-1002; wording fix YAH-1084): the pages
  # carry the "Coming soon" label, and the fields stay hidden from the published
  # reference until the CTO opens the public claim. The PATCH project and the
  # playback-token request bodies use `$ref` schemas, so the fields are removed
  # on the component that defines them.
  - target: $.components.schemas.Project.properties.ipBinding
    remove: true
  - target: $.components.schemas.Project.required[?(@ == 'ipBinding')]
    remove: true
  - target: $.components.schemas.ProjectUpdateInput.properties.ipBinding
    remove: true
  - target: $.components.schemas.PlaybackTokenInput.properties.viewerIp
    remove: true
  # The description still advertised network binding after the field was hidden
  # (same leak the accessMode precedent closed by rewriting the video PATCH
  # description).
  - target: $.components.schemas.ProjectUpdateInput.description
    update: |
      Rename a project and/or update its white-label branding. At least one field is required.
  # Phone verification is Not planned (board, 19 Oct 2026; public wording in
  # PRs #550 and #551). The two phone routes are still in the API, but there is
  # no SMS service behind them: in production they answer 503
  # sms_not_configured. The published reference must not teach a feature we
  # are not building, so the routes and their schemas stay out until the CTO
  # marks them Available in the claims register (YAH-876).
  - target: $.paths['/v1/me/phone/start']
    remove: true
  - target: $.paths['/v1/me/phone/verify']
    remove: true
  - target: $.components.schemas.PhoneStartInput
    remove: true
  - target: $.components.schemas.PhoneChallenge
    remove: true
  - target: $.components.schemas.PhoneVerifyInput
    remove: true
  - target: $.components.schemas.PhoneVerified
    remove: true
  # The two phone fields on the GET /v1/me answer are part of the same
  # not-planned feature.
  - target: $.components.schemas.Me.properties.account.properties.phoneVerified
    remove: true
  - target: $.components.schemas.Me.properties.account.properties.phoneVerificationRequired
    remove: true
  # Webhook secret rotation, the delivery log and the send-test-event call are
  # live in production as of v0.15.0 (YAH-1099), so they render in the published
  # reference. Do not re-add a `remove` overlay for these three routes.
  # The video list and project list `total` fields are built, but the live API
  # does not return them yet. The published reference must not promise a field
  # the live API does not send, so it stays optional and is marked Coming soon
  # until the release that ships it. The two OpenAPI copies stay in step with
  # the code and the SDK; only the public projection changes here.
  - target: $.components.schemas.VideoList.required[?(@ == 'total')]
    remove: true
  - target: $.components.schemas.VideoList.properties.total.description
    update: |
      Coming soon. Count of all matching videos, not just this page.
      Not returned yet, so do not rely on it today.
  - target: $.components.schemas.ProjectList.required[?(@ == 'total')]
    remove: true
  - target: $.components.schemas.ProjectList.properties.total.description
    update: |
      Coming soon. Count of all matching projects, not just this page.
      Not returned yet, so do not rely on it today.
