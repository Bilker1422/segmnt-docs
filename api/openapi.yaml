openapi: 3.1.0
info:
  title: segmnt API
  version: 0.19.19
  summary: Video infrastructure. Upload through one API and we encode, store, secure and stream it on your own domain.
  description: |
    The segmnt API contract. It can change while we build it.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: segmnt engineering
servers:
  - url: https://api.segmnt.cloud
    description: Production
security:
  - apiKey: []
  - session: []
tags:
  - name: Auth
    description: |
      SSO sign-in for the dashboard. No passwords are stored. Sign-in is a
      browser redirect flow: `/auth/{provider}/start` → the provider →
      `/auth/{provider}/callback`, which sets the `segmnt_session` cookie.
      Launch providers: Google and GitHub. Apple and Reddit come later.
  - name: Projects
    description: |
      How many projects an account can have depends on its plan: Free and
      Starter 1, Pro and Pilot (by invitation) 3, Agency 25. Agencies use one project per client.
  - name: API keys
    description: Server-side keys. Each key belongs to one project.
  - name: Domains
    description: Sites allowed to play the project's videos. A domain must be verified with a DNS TXT record.
  - name: Uploads
    description: Direct upload from the client to storage with pre-signed multipart URLs.
  - name: Upload tokens
    description: |
      Short-lived, single-use tokens for uploading from a browser. Your server
      mints one with the project API key; the browser uses it for exactly one
      upload and never sees the key.
  - name: Videos
    description: Uploaded videos and their processing status.
  - name: Playback
    description: Signed playback tokens.
  - name: Demo
    description: |
      The public marketing `/demo` page. It fetches a fresh, short-lived
      playback token on load so the page holds no key and no long-lived token.
      No authentication; one protected demo video, fixed by configuration.
  - name: Webhooks
    description: |
      HTTPS endpoints that receive video events. To test, register your own
      receiver and upload a short video.
  - name: Usage
    description: Stored and watched time.
  - name: Billing
    description: Plans, checkout and the paid-plan whitelist.
  - name: System
    description: Health check.
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          description: The API is not ready.
        4XX:
          description: Client error.
  /auth/providers:
    get:
      tags:
        - Auth
      operationId: listAuthProviders
      summary: List the enabled sign-in providers
      description: |
        The dashboard calls this to draw its sign-in buttons. A provider is
        listed only when it is configured in this environment.
      security: []
      responses:
        '200':
          description: The enabled providers, and the state of the bot gate.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - turnstile
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthProvider'
                  turnstile:
                    type: object
                    required:
                      - enabled
                      - siteKey
                    description: |
                      The state of the sign-in / sign-up bot gate. The gate is off
                      by default. When `enabled` is true the dashboard draws the
                      widget and sends its answer as `cf_turnstile_response` to
                      `GET /auth/{provider}/start`. The secret is never returned.
                    properties:
                      enabled:
                        type: boolean
                        description: True only when the gate is on.
                      siteKey:
                        type:
                          - string
                          - 'null'
                        description: Public widget site key, or null when the gate is off.
  /auth/{provider}/start:
    parameters:
      - $ref: '#/components/parameters/AuthProviderId'
    get:
      tags:
        - Auth
      operationId: startAuth
      summary: Start an SSO sign-in (browser only)
      description: |
        Redirects the browser to the provider's sign-in page. Sets a short-lived
        signed `segmnt_auth` cookie with the CSRF `state`, the PKCE verifier and
        the `nonce` (`Path=/auth`, `HttpOnly`, `Secure`, `SameSite=Lax`,
        10 minutes). After sign-in the browser lands on `return_to`.
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          description: |
            Where to send the browser after sign-in: a path on the dashboard
            (`/videos`) or a full URL on an allowed dashboard origin. Any other
            value falls back to the dashboard root, so this route is never an
            open redirect.
          schema:
            type: string
            maxLength: 2048
        - name: cf_turnstile_response
          in: query
          required: false
          description: |
            The Turnstile widget answer. Only needed when the bot gate is on
            (`turnstile.enabled` in `GET /auth/providers`); it is ignored while
            the gate is off. The gate is off by default.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the provider. `Location` is its authorize URL.
          headers:
            Location:
              schema:
                type: string
        '403':
          description: |
            The bot check failed (`code` is `bot_challenge_failed`). The gate is
            off by default; when it is on the check fails closed, so a missing,
            bad or expired answer, a siteverify error, or a check slower than
            5 seconds refuses the start with no redirect.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'
  /auth/{provider}/callback:
    parameters:
      - $ref: '#/components/parameters/AuthProviderId'
    get:
      tags:
        - Auth
      operationId: completeAuth
      summary: Complete an SSO sign-in (the provider redirects here)
      description: |
        The provider redirects the browser here with `code` and `state`. The API
        checks `state` and the flow cookie, exchanges the code (PKCE, and the
        `nonce` for Google), creates the account on first sign-in, sets the
        `segmnt_session` cookie (30 days), clears the flow cookie and redirects
        to `return_to`.

        A second provider links to an existing account only when its e-mail is
        provider-verified; otherwise it creates a new account. Every new account
        goes through a short review before it can start.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: The provider's authorization code. Missing when the user denied sign-in.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: The `state` the API sent in the authorize URL. Must match the flow cookie.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Provider error when the user denied sign-in, for example `access_denied`.
          schema:
            type: string
      responses:
        '302':
          description: Signed in. `Location` is `return_to`; `Set-Cookie` carries the session.
          headers:
            Location:
              schema:
                type: string
        '400':
          description: |
            Missing, tampered or expired flow cookie, or `state` mismatch
            (`code` is `invalid_state`); or the user denied sign-in
            (`auth_denied`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Could not create the account or the session (`code` is `internal_error`). The flow cookie is cleared.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: The provider rejected the code or returned data we cannot trust (`code` is `provider_error`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: End the dashboard session
      description: |
        Deletes the session and clears the `segmnt_session` cookie. Safe to call
        twice: a missing or expired session still returns `204`.
      security: []
      responses:
        '204':
          description: Logged out.
  /v1/me:
    get:
      tags:
        - Auth
      operationId: getMe
      summary: The signed-in user and its account
      description: |
        Returns the signed-in user and its account. A visitor who is not
        signed in (no session, expired session, signed out) gets
        `401 unauthorized`.
      security:
        - session: []
      responses:
        '200':
          description: The session's user and account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/projects:
    get:
      tags:
        - Projects
      operationId: listProjects
      summary: List projects
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Projects in the account, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Projects
      operationId: createProject
      summary: Create a project
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Projects
      operationId: getProject
      summary: Get a project
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Projects
      operationId: updateProject
      summary: Rename a project and/or update its white-label branding
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateInput'
      responses:
        '200':
          description: Project updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Projects
      operationId: deleteProject
      summary: Delete a project
      description: Only an empty project can be deleted. Delete its videos first.
      security:
        - session: []
      responses:
        '204':
          description: Project deleted. Its API keys, domains and webhook endpoints stop working.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/projects/{projectId}/api-keys:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - API keys
      operationId: listApiKeys
      summary: List API keys
      security:
        - session: []
      responses:
        '200':
          description: Keys of the project. The secret is never returned here.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - API keys
      operationId: createApiKey
      summary: Create an API key
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  examples:
                    - Course site backend
                scope:
                  type: string
                  enum:
                    - full
                    - playback
                  default: full
                  description: |
                    `playback` creates a key that can only mint playback tokens
                    (for the WordPress plugin). Omit it for a normal `full` key.
      responses:
        '201':
          description: Key created. `secret` is shown only in this response. We store only a hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{projectId}/api-keys/{keyId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: keyId
        in: path
        required: true
        schema:
          type: string
          pattern: ^key_[A-Za-z0-9]+$
    delete:
      tags:
        - API keys
      operationId: revokeApiKey
      summary: Revoke an API key
      security:
        - session: []
      responses:
        '204':
          description: Key revoked. Requests with it get `401` right away.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{projectId}/domains:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Domains
      operationId: listDomains
      summary: List domains
      responses:
        '200':
          description: Domains of the project.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Domain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Domains
      operationId: addDomain
      summary: Add a domain
      description: |
        Adds a domain in `pending` status. Create the DNS TXT record from
        `verification`, then call the verify route. Free accounts can have one
        verified domain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hostname
              properties:
                hostname:
                  type: string
                  format: hostname
                  description: Exact host name, without scheme or path.
                  examples:
                    - courses.example.com
      responses:
        '201':
          description: Domain added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/projects/{projectId}/domains/{domainId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DomainId'
    delete:
      tags:
        - Domains
      operationId: removeDomain
      summary: Remove a domain
      responses:
        '204':
          description: Domain removed. New tokens for it are refused. Tokens already issued work until they expire.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{projectId}/domains/{domainId}/verify:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DomainId'
    post:
      tags:
        - Domains
      operationId: verifyDomain
      summary: Check the DNS record and verify a domain
      responses:
        '200':
          description: Check done. `status` is `verified` when the TXT record was found, otherwise still `pending`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{projectId}/upload-tokens:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags:
        - Upload tokens
      operationId: createUploadToken
      summary: Create a browser upload token
      description: |
        Call this from your server when a user uploads a file from the browser.
        The token is short-lived and single-use: it allows exactly two calls,
        one create and the matching complete, and nothing else. It cannot read,
        list, delete or play.

        The key stays on your server. Send the returned `token` to the browser,
        which calls the upload routes with `Authorization: Bearer <token>` and
        the `Origin` of the verified domain.

        The token carries a maximum size and the allowed content type, and we
        enforce both. It is also bound to one verified domain of the project: a
        browser on any other domain is refused. Origin is not a substitute for
        the token, so a leaked token is limited by its size cap, one-shot use
        and short life.

        Requires a full-scope project API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadTokenInput'
      responses:
        '201':
          description: Token created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Upload signing keys are not configured (`upload_not_configured`).
  /v1/projects/{projectId}/uploads:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags:
        - Uploads
      operationId: createUpload
      summary: Start an upload
      description: |
        Creates a video in `uploading` status and returns one pre-signed `PUT` URL
        per part. The client sends each part straight to storage, keeps the `ETag`
        response header of each part, then calls the complete route.

        Two ways to authenticate: a project API key or session from your server,
        or a single-use upload token from `POST /v1/projects/{projectId}/upload-tokens`
        for a browser. With a token, the browser must send the token's verified
        domain as its `Origin`; the token's `maxSizeBytes` and content type are
        enforced here and on complete.

        Part upload: `PUT` the raw bytes to the part URL with the exact size of
        that part as `Content-Length`. No auth header is needed (`Content-Type`
        is not checked). The part URL signs the part's `Content-Length`, so a
        request that declares a different length is refused. Storage CORS allows
        `PUT` from any origin and exposes `ETag`, so a browser can read it.

        URLs are for upload only. Playback never uses storage URLs. Part URLs
        work for 4 hours. The upload itself stays open until `expiresAt`, 24
        hours after the start; calling create again with the same
        `Idempotency-Key` returns the same upload with fresh part URLs.

        Plan limits are checked here with `sizeBytes`, and again later: on complete
        (real file size) and before encoding (real duration). A file over the limit
        ends as `failed` with `failure.code` = `plan_limit_reached` and is removed.

        Upload hours: Starter, Pro and Agency can keep uploading after they use
        their included upload hours in the calendar month, up to 3 times those
        hours. The included hours are 5 h on Starter, 15 h on Pro and 30 h on
        Agency, so the cap is 15 h, 45 h and 90 h. At the cap, this call returns
        `403` with `code` = `plan_limit_reached` and `limit` = `monthly_uploads_cap`.
        To go higher, contact support. Free and Pilot (by invitation) stop at their included hours
        and return `403` with `limit` = `monthly_uploads`. Upload hours count the
        processing hours of new uploads, as on the usage page. The stored-hours
        limit, the file size, the video length and the encode limit still apply.

        Rate limits: a call that uses a project API key is not limited per IP.
        Each key may make up to 1,000 create and complete calls a minute. A browser
        that uses an upload token is limited to 60 calls a minute per IP address.
        If a call is limited,
        the API returns `429` with a `Retry-After` header. Wait that many seconds,
        then try again.
      security:
        - apiKey: []
        - session: []
        - uploadToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadInput'
      responses:
        '201':
          description: Upload started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/projects/{projectId}/uploads/{uploadId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UploadId'
    delete:
      tags:
        - Uploads
      operationId: abortUpload
      summary: Cancel an upload
      description: Removes the uploaded parts and cancels the video, which ends as `failed` with `failure.code` = `upload_cancelled` (customer fault, `retryable` false, one `video.failed` event). An unfinished upload left past `expiresAt` ends the same way, with `upload_expired`, without being deleted.
      responses:
        '204':
          description: Upload cancelled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/projects/{projectId}/uploads/{uploadId}/complete:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UploadId'
    post:
      tags:
        - Uploads
      operationId: completeUpload
      summary: Finish an upload
      description: |
        Joins the parts and starts encoding. The video moves to `processing`.
        Safe to retry: if the upload was already completed, it returns `202` with
        the current video.

        A browser calls this with its upload token, and only for the upload that
        token created. A token cannot complete another upload.

        Rate limits: a call that uses a project API key is not limited per IP.
        Each key may make up to 1,000 create and complete calls a minute. A browser
        that uses an upload token is limited to 60 calls a minute per IP address.
        If a call returns
        `429` with a `Retry-After` header, wait that many seconds, then call
        complete again. It is safe to repeat.
      security:
        - apiKey: []
        - session: []
        - uploadToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - parts
              properties:
                parts:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    type: object
                    required:
                      - partNumber
                      - etag
                    properties:
                      partNumber:
                        type: integer
                        minimum: 1
                        maximum: 10000
                      etag:
                        type: string
                        description: Value of the `ETag` header returned by the part upload.
      responses:
        '202':
          description: Upload finished. Encoding started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          description: |
            The part list is not the whole upload. Send each part number from 1 to
            the part count once. The `detail` names the first problem, for example
            `part 2 is missing.` The upload stays open: upload the missing part and
            complete again with the full list.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The upload was cancelled or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/projects/{projectId}/videos:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Videos
      operationId: listVideos
      summary: List videos
      parameters:
        - name: status
          in: query
          required: false
          description: Only videos with this status.
          schema:
            $ref: '#/components/schemas/VideoStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Videos, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{projectId}/videos/{videoId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/VideoId'
    get:
      tags:
        - Videos
      operationId: getVideo
      summary: Get a video and its status
      responses:
        '200':
          description: The video.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Videos
      operationId: updateVideo
      summary: Update a video
      description: |
        Rename the video. Provide `title`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title:
                  $ref: '#/components/schemas/VideoTitle'
      responses:
        '200':
          description: Video updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Videos
      operationId: deleteVideo
      summary: Delete a video
      description: Deletes the original, the HLS renditions and the thumbnail, and stops playback. Playback stops within about a minute. The original is removed at once; the HLS renditions and thumbnail are removed in the background, so storage clears shortly after.
      responses:
        '204':
          description: Video deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/demo/playback:
    get:
      tags:
        - Demo
      operationId: getDemoPlayback
      summary: Create a demo playback token
      description: |
        Public and unauthenticated. The marketing `/demo` page calls this on load
        to play one protected demo video with a fresh signed token, so the page
        holds no key and no long-lived token. The video and the allowed domain
        are fixed by configuration; a caller cannot choose either. The response
        is rate limited per client IP.
      security: []
      responses:
        '200':
          description: A fresh, short-lived playback token for the demo video.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoPlayback'
        '404':
          description: The configured demo video does not exist (`code` is `not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: Method not allowed. This route is `GET` only.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The demo video is not `ready` yet, or it is held for review (`code` is `video_not_ready`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: The demo is not configured in this environment, or playback signing keys are not set (`code` is `demo_not_configured` or `playback_not_configured`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/projects/{projectId}/videos/{videoId}/playback-tokens:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/VideoId'
    post:
      tags:
        - Playback
      operationId: createPlaybackToken
      summary: Create a playback token
      description: |
        Call this from your server each time you show the video to a viewer.
        The token is signed (HMAC) and holds the video ID, the expiry and the
        allowed domain. The CDN refuses requests whose `Origin` or `Referer` is
        another domain, and refuses a token whose video ID is another video.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackTokenInput'
      responses:
        '201':
          description: Token created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/projects/{projectId}/videos/{videoId}/preview-token:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/VideoId'
    post:
      tags:
        - Playback
      operationId: createPreviewToken
      summary: Create a dashboard preview token
      description: |
        Used by the dashboard's first-run wizard to test a video in our player
        before it is embedded on a customer site. Unlike `createPlaybackToken`,
        this route is **session**-authenticated: a new user has no API key, and a
        key secret must never reach the browser. The account must own the project.

        The token is short-lived and its allowed domain is fixed to one of our
        dashboard hosts (never a caller-supplied value). The CDN and the embed
        page both use that domain, so a preview token plays only while the
        dashboard frames it and is useless on a customer site.
      security:
        - session: []
      responses:
        '201':
          description: Preview token created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/projects/{projectId}/webhook-endpoints:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Webhooks
      operationId: listWebhookEndpoints
      summary: List webhook endpoints
      responses:
        '200':
          description: Endpoints of the project. The signing secret is never returned here.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEndpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Webhooks
      operationId: createWebhookEndpoint
      summary: Add a webhook endpoint
      description: |
        Up to 5 endpoints per project. The host must resolve to a public address;
        private, loopback and link-local addresses are refused here (`400`) and
        again on every send.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
                - events
              properties:
                url:
                  type: string
                  format: uri
                  pattern: ^https://
                  examples:
                    - https://courses.example.com/hooks/segmnt
                events:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/WebhookEventType'
      responses:
        '201':
          description: Endpoint added. `signingSecret` is shown only in this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointWithSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{projectId}/webhook-endpoints/{endpointId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: endpointId
        in: path
        required: true
        schema:
          type: string
          pattern: ^whe_[A-Za-z0-9]+$
    delete:
      tags:
        - Webhooks
      operationId: deleteWebhookEndpoint
      summary: Remove a webhook endpoint
      responses:
        '204':
          description: Endpoint removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{projectId}/usage:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Usage
      operationId: getProjectUsage
      summary: Get project usage
      description: Project usage for a period, plus the account plan, its limits and the headroom left, so an API key can check them without a dashboard session.
      parameters:
        - name: from
          in: query
          required: false
          description: Start of the period (inclusive). Default is the start of the current billing period.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: End of the period (inclusive). Default is today.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Usage of the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUsage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/billing/plan:
    get:
      tags:
        - Billing
      operationId: getBillingPlan
      summary: Get the account's plan, limits and usage
      security:
        - session: []
      responses:
        '200':
          description: Current plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/usage/summary:
    get:
      tags:
        - Billing
      operationId: getUsageSummary
      summary: Get the account's plan limits and usage, plus the last three closed months
      description: |
        Read-only usage for the signed-in account. Each meter reports `used`,
        `included` (`null` when the plan has no limit), `remaining` (never
        negative) and `percent` (`null` when there is no limit). `processed_hours`
        comes from the upload ledger, so it is never a made-up number. No price
        is returned; this endpoint reports usage and limits only.
      security:
        - session: []
      responses:
        '200':
          description: Current usage summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/billing/plans:
    get:
      tags:
        - Billing
      operationId: listBillingPlans
      summary: List plans you can buy
      security:
        - session: []
      responses:
        '200':
          description: Plans on sale.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/billing/checkout:
    post:
      tags:
        - Billing
      operationId: createCheckout
      summary: Start a checkout
      description: |
        Paid plans are not open yet. This call returns `503 billing_paused`.
        Nothing is charged and no plan changes. Join the paid-plan whitelist with
        `POST /v1/billing/whitelist` and we contact you when paid plans open.

        Once paid plans open, this call returns a checkout page, and the plan
        changes only after the payment is confirmed.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - planId
              properties:
                planId:
                  $ref: '#/components/schemas/PlanId'
      responses:
        '201':
          description: Checkout created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/BillingPaused'
  /v1/billing/whitelist:
    get:
      tags:
        - Billing
      operationId: listPlanWhitelist
      summary: List the account's paid-plan whitelist entries
      description: |
        The account's own whitelist entries. Paid plans are not on sale yet, so a
        customer joins this list instead of checking out.
      security:
        - session: []
      responses:
        '200':
          description: The account's entries.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WhitelistEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Billing
      operationId: joinPlanWhitelist
      summary: Join the paid-plan whitelist
      description: |
        Records the account's interest in a paid plan. This stores INTENT only: it
        takes no payment and never changes the plan. It is idempotent per account
        and plan — calling it again refreshes the e-mail and keeps the original
        `createdAt`.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhitelistJoinRequest'
      responses:
        '201':
          description: The entry (created or refreshed).
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/WhitelistEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/projects/{projectId}/videos/{videoId}/reports:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags:
        - Videos
      operationId: createVideoReport
      summary: File a viewer report on a video
      description: |
        The customer's server files a report (for example a viewer pressed a
        "report" button in the player). Every report is saved at once. The
        customer sees nothing back except the stored report.
        With an `Idempotency-Key`, a retried POST returns the first report and
        saves no second one; without it, a report is at-least-once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoReportInput'
      responses:
        '200':
          description: The report already existed (same `Idempotency-Key`); no new alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoReport'
        '201':
          description: The report was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
webhooks:
  video.ready:
    post:
      tags:
        - Webhooks
      operationId: onVideoReady
      summary: All qualities are ready and the video can play
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookReceived'
  video.failed:
    post:
      tags:
        - Webhooks
      operationId: onVideoFailed
      summary: Encoding failed
      description: '`data.video.failure` says why. Sent once for every video that moves to `failed`, including an upload that was cancelled (`upload_cancelled`) or expired before complete-upload (`upload_expired`). Read `failure.code` to tell them apart.'
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookReceived'
  video.held:
    post:
      tags:
        - Webhooks
      operationId: onVideoHeld
      summary: Our team held the video and it does not play
      description: |
        When the hold ends, `video.ready` is sent again. `data.reason` says why we
        held it, when we have one.
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookReceived'
  video.removed:
    post:
      tags:
        - Webhooks
      operationId: onVideoRemoved
      summary: The video was removed and it no longer plays
      description: |
        The video was removed. It is deleted, so `GET
        /v1/projects/{projectId}/videos/{videoId}` answers `404` and playback
        stops. `data.reason` says why, when we have one: for example
        `deleted_by_customer` (you deleted it) or `plan_ended` (it was removed
        30 days after a paid plan stopped). For a legal matter we do not send
        this event.
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookReceived'
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Project API key. Server-side only.
    session:
      type: apiKey
      in: cookie
      name: segmnt_session
      description: Dashboard session cookie, set after SSO sign-in.
    uploadToken:
      type: http
      scheme: bearer
      description: |
        Browser upload token from `POST /v1/projects/{projectId}/upload-tokens`.
        Short-lived and single-use. Accepted only on the upload create and
        complete routes, and only from the token's verified domain.
  parameters:
    AuthProviderId:
      name: provider
      in: path
      required: true
      description: Sign-in provider id, from `GET /auth/providers` (for example `google`).
      schema:
        type: string
        pattern: ^[a-z0-9_-]+$
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: ^prj_[A-Za-z0-9]+$
    VideoId:
      name: videoId
      in: path
      required: true
      schema:
        type: string
        pattern: ^vid_[A-Za-z0-9]+$
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        pattern: ^upl_[A-Za-z0-9]+$
    DomainId:
      name: domainId
      in: path
      required: true
      schema:
        type: string
        pattern: ^dom_[A-Za-z0-9]+$
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: '`nextCursor` from the previous page.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Any unique string. A retry with the same key returns the first result.
      schema:
        type: string
        maxLength: 255
    WebhookSignature:
      name: Segmnt-Signature
      in: header
      required: true
      description: |
        `t=<unix seconds>,v1=<hex HMAC-SHA256>`. The HMAC is over `<t>.<raw body>`
        with the endpoint's signing secret. `t` is the time of this delivery
        attempt (each retry is signed again), so refuse a `t` older than 5 minutes.
      schema:
        type: string
        examples:
          - t=1791648000,v1=5f2b...
  responses:
    AuthNotConfigured:
      description: Sign-in is not configured in this environment (`code` is `not_configured`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request is not valid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or wrong API key or session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        Not allowed. `code` says why. Two common codes: `insufficient_scope` (a
        playback-only API key called a route it may not use), and
        `plan_limit_reached` (the account has hit a plan limit).

        For `plan_limit_reached`, the `limit` field names the limit that was hit:
        `stored_hours`, `monthly_uploads`, `monthly_uploads_cap`, `file_size`,
        `video_duration`, `watched_minutes`, `quality`, `projects`, `white_label`
        or `verified_domains`. The `code` does not change.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found, or not in a project this key or session can use.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The resource is in the wrong state, for example a video that is not `ready` yet.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit reached. Wait for `Retry-After` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Temporary storage failure (`code` is `storage_unavailable`). The request did not finish and is safe to retry unchanged.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BillingPaused:
      description: Paid plans are not on sale yet (`code` is `billing_paused`). Nothing was charged and no plan changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WebhookReceived:
      description: |
        Return any 2xx within 10 seconds. Other answers are retried with a
        growing wait, up to about 8 attempts, then we mark that delivery failed.
        Events can arrive more than once and out of order:
        use `id` to skip duplicates, and ignore an event whose
        `data.video.updatedAt` is older than the one you have (or call
        `GET` video for the current state).
  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable error code for programs.
          examples:
            - plan_limit_reached
        detail:
          type: string
        limit:
          type: string
          description: |
            From the API. On `403 plan_limit_reached`, the plan limit that was hit,
            for example `monthly_uploads_cap`. The playback CDN does not send this
            field for a blocked or over-limit project. It does send it for `quality`
            and `white_label` refusals.
    Timestamp:
      type: string
      format: date-time
    AuthProvider:
      type: object
      required:
        - id
        - label
      properties:
        id:
          type: string
          description: Provider id, used in the `/auth/{provider}/...` routes.
          examples:
            - google
        label:
          type: string
          description: Human-readable name for the sign-in button.
          examples:
            - Google
    Me:
      type: object
      required:
        - user
        - account
      properties:
        user:
          type: object
          required:
            - id
            - role
          properties:
            id:
              type: string
              examples:
                - usr_9fK2mQ
            email:
              type:
                - string
                - 'null'
              description: Only set when a provider verified it.
            displayName:
              type:
                - string
                - 'null'
            role:
              type: string
              description: The user's role in the account, for example `owner`.
              examples:
                - owner
        account:
          type: object
          required:
            - id
            - name
            - planId
            - planStatus
            - createdAt
          properties:
            id:
              type: string
              examples:
                - acc_5bT8qL
            name:
              type: string
            planId:
              type: string
              description: Current plan, for example `free`.
              examples:
                - free
            planStatus:
              type: string
              enum:
                - active
                - pilot
                - past_due
                - canceled
            createdAt:
              $ref: '#/components/schemas/Timestamp'
    Project:
      type: object
      required:
        - id
        - name
        - createdAt
        - whiteLabel
        - branding
      properties:
        id:
          type: string
          examples:
            - prj_8fK2mQ
        name:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        whiteLabel:
          type: boolean
          readOnly: true
          description: |
            True when the account's plan may hide our logo and brand the player
            (Pro and Agency; Free and Starter always keep our logo and brand colour).
        branding:
          $ref: '#/components/schemas/ProjectBranding'
    ProjectBranding:
      type: object
      required:
        - hideLogo
        - primaryColor
        - logoUrl
      description: White-label player branding. Pro and Agency only (Free and Starter always keep our logo and brand colour).
      properties:
        hideLogo:
          type: boolean
          default: false
          description: Hide the segmnt badge on the player.
        primaryColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          default: '#0B5D42'
          examples:
            - '#0B5D42'
          description: Player primary colour (accent).
        logoUrl:
          type:
            - string
            - 'null'
          description: |
            Customer logo shown instead of ours, or null. Must be an
            `https://` URL (up to 2048 characters); an `http://` URL is
            rejected and reads back as null.
    ProjectInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - Client A courses
    ProjectUpdateInput:
      type: object
      minProperties: 1
      description: |
        Rename a project and/or update its white-label branding. At least one field is required.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - Client A courses
        branding:
          type: object
          minProperties: 1
          description: |
            Partial branding update. Setting branding on a plan without
            `whiteLabel` returns `403 plan_limit_reached`.
          properties:
            hideLogo:
              type: boolean
            primaryColor:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
            logoUrl:
              type:
                - string
                - 'null'
              description: |
                Customer logo URL. Must be an `https://` URL (up to 2048
                characters), or null to clear it. An `http://` URL is
                rejected with `400 invalid_request`.
    ProjectList:
      type: object
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        nextCursor:
          type:
            - string
            - 'null'
        total:
          type: integer
          description: |
            Coming soon. Count of all matching projects, not just this page.
            Not returned yet, so do not rely on it today.
    ApiKey:
      type: object
      required:
        - id
        - name
        - prefix
        - scope
        - createdAt
        - lastUsedAt
      properties:
        id:
          type: string
          examples:
            - key_3hT9aZ
        name:
          type: string
        prefix:
          type: string
          description: First characters of the key, to recognise it.
          examples:
            - Abcd1234
        scope:
          type: string
          enum:
            - full
            - playback
          description: |
            `full` (default): the key can call every `/v1` route of its project.
            `playback`: the key can call ONLY the playback-token mint route, so a
            key that sits on a customer's server (for example a WordPress site)
            cannot upload, encode, delete, read account data, or spend money.
          examples:
            - full
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          description: |
            When the key was last used. Updated at most once a minute, so it can lag
            real use by up to 60 seconds; `null` means the key has never been used.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    ApiKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required:
            - secret
          properties:
            secret:
              type: string
              description: |
                The full key: `sk_{prefix}_{secret}` (docs/architecture.md section 9).
                Shown only in this response; we store only the SHA-256 of the secret.
    Domain:
      type: object
      required:
        - id
        - hostname
        - status
        - verification
        - createdAt
        - verifiedAt
      properties:
        id:
          type: string
          examples:
            - dom_7pW1cX
        hostname:
          type: string
          description: |
            Lowercase hostname. Playback matches this exact host only (see
            Playback in the API description); a subdomain needs its own domain.
          examples:
            - courses.example.com
        status:
          type: string
          enum:
            - pending
            - verified
        verification:
          type: object
          description: Create this DNS record to prove you own the domain.
          required:
            - type
            - name
            - value
          properties:
            type:
              type: string
              const: TXT
            name:
              type: string
              examples:
                - _segmnt-verify.courses.example.com
            value:
              type: string
              examples:
                - segmnt-verify=b41c09e2f7a3d6c1
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        verifiedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    UploadInput:
      type: object
      required:
        - title
        - fileName
        - sizeBytes
        - contentType
      properties:
        title:
          $ref: '#/components/schemas/VideoTitle'
        fileName:
          type: string
          maxLength: 255
          examples:
            - lesson-01.mp4
        sizeBytes:
          type: integer
          minimum: 1
          description: File size. The plan sets the maximum.
          examples:
            - 2147483648
        contentType:
          type: string
          enum:
            - video/mp4
            - video/quicktime
            - video/webm
            - video/x-matroska
    Upload:
      type: object
      required:
        - id
        - video
        - partSizeBytes
        - parts
        - expiresAt
      properties:
        id:
          type: string
          examples:
            - upl_2bN6rD
        video:
          $ref: '#/components/schemas/Video'
        partSizeBytes:
          type: integer
          description: Size of every part except the last one.
          examples:
            - 104857600
        parts:
          type: array
          items:
            type: object
            required:
              - partNumber
              - url
            properties:
              partNumber:
                type: integer
                minimum: 1
              url:
                type: string
                format: uri
                description: Pre-signed `PUT` URL for this part. Do not log it.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    UploadTokenInput:
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
          format: hostname
          description: A verified domain of the project, where the browser runs.
          examples:
            - courses.example.com
        maxSizeBytes:
          type: integer
          minimum: 1
          description: |
            Hard cap on the uploaded file size, in bytes. Defaults to the plan
            maximum and is never allowed above it.
          examples:
            - 2147483648
        contentType:
          type: string
          enum:
            - video/mp4
            - video/quicktime
            - video/webm
            - video/x-matroska
          description: |
            The one content type the upload may declare. Omit it to allow any
            supported type.
        title:
          $ref: '#/components/schemas/VideoTitle'
        expiresInSeconds:
          type: integer
          minimum: 300
          maximum: 7200
          default: 3600
          description: How long the token lives. Keep it short; it is single-use.
    UploadToken:
      type: object
      required:
        - token
        - expiresAt
        - projectId
        - domain
        - maxSizeBytes
        - contentTypes
      properties:
        token:
          type: string
          description: |
            Opaque signed token. Send it to the browser, which uses it as
            `Authorization: Bearer <token>`. Never send your API key to a
            browser. Do not log the token.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        projectId:
          type: string
          description: The project the token may upload to.
          examples:
            - prj_2bN6rD
        domain:
          type: string
          description: The verified domain the token is bound to.
          examples:
            - courses.example.com
        maxSizeBytes:
          type: integer
          description: Hard cap on the uploaded file size, in bytes.
        contentTypes:
          type: array
          items:
            type: string
          description: The content types the upload may declare.
        title:
          $ref: '#/components/schemas/VideoTitle'
    VideoTitle:
      type: string
      minLength: 1
      maxLength: 200
      examples:
        - Lesson 1 - Introduction
    VideoStatus:
      type: string
      enum:
        - uploading
        - processing
        - ready
        - failed
        - held
      description: |
        - `uploading`: waiting for the parts and the complete call.
        - `processing`: encoding to HLS.
        - `ready`: can play.
        - `failed`: encoding failed; see `failure`.
        - `held`: held by our team; does not play.
    Quality:
      type: string
      enum:
        - 360p
        - 720p
        - 1080p
      description: The quality is never above the source video.
    Video:
      type: object
      required:
        - id
        - projectId
        - title
        - status
        - durationSeconds
        - qualities
        - sizeBytes
        - failure
        - createdAt
        - updatedAt
        - readyAt
      properties:
        id:
          type: string
          examples:
            - vid_9xR4tL
        projectId:
          type: string
        title:
          $ref: '#/components/schemas/VideoTitle'
        status:
          $ref: '#/components/schemas/VideoStatus'
        durationSeconds:
          type:
            - number
            - 'null'
          description: Known after encoding.
        qualities:
          type: array
          description: Qualities that can play. Empty until `ready`.
          items:
            $ref: '#/components/schemas/Quality'
        sizeBytes:
          type: integer
          description: Size of the original file.
        failure:
          description: Set only when `status` is `failed`.
          oneOf:
            - type: object
              required:
                - code
                - message
                - retryable
              properties:
                code:
                  type: string
                  examples:
                    - unsupported_codec
                message:
                  type: string
                retryable:
                  type: boolean
                  description: |
                    `true` when the cause may be temporary, so uploading the same
                    file again could succeed. `false` when the cause is
                    permanent (for example the file has no usable video stream,
                    or it is over the plan limit), so the client must fix the
                    file or the plan and upload again (YAH-1293).
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        readyAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    VideoList:
      type: object
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Video'
        nextCursor:
          type:
            - string
            - 'null'
        total:
          type: integer
          description: |
            Coming soon. Count of all matching videos, not just this page.
            Not returned yet, so do not rely on it today.
    DemoPlayback:
      type: object
      required:
        - cdnUrl
        - videoId
        - token
        - expiresAt
      properties:
        cdnUrl:
          type: string
          format: uri
          description: Base media URL. Append `/v/{videoId}/master.m3u8` for the HLS playlist.
          examples:
            - https://cdn.segmnt.cloud
        videoId:
          type: string
        token:
          type: string
          description: Opaque. Do not parse it; the format can change.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    PlaybackTokenInput:
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
          format: hostname
          description: A verified domain of the project, where the player runs.
          examples:
            - courses.example.com
        expiresInSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 14400
          description: Make it longer than the video so playback does not stop.
    PlaybackToken:
      type: object
      required:
        - token
        - expiresAt
        - embedUrl
        - thumbnailUrl
      properties:
        token:
          type: string
          description: Opaque. Do not parse it; the format can change.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        playlistUrl:
          type: string
          format: uri
          description: |
            HLS master playlist for your own player (hls.js or Safari). Only on
            plans with `whiteLabel`; other plans must use `embedUrl`, which shows
            our logo. The CDN adds the token to every link inside the playlists.
          examples:
            - https://cdn.segmnt.cloud/v/vid_9xR4tL/master.m3u8?token=...
        embedUrl:
          type: string
          format: uri
          description: Our player (hls.js) for an iframe on the token's domain. Shows our logo unless the plan has `whiteLabel`.
        thumbnailUrl:
          type: string
          format: uri
    PreviewToken:
      type: object
      required:
        - token
        - expiresAt
        - embedUrl
        - thumbnailUrl
      properties:
        token:
          type: string
          description: |
            Opaque signed token. Do not parse it. It works for one video, one
            dashboard host and a short time only.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        embedUrl:
          type: string
          format: uri
          description: |
            Our player (hls.js) for an iframe. The URL has no token in it: the
            dashboard appends the real token for the live preview and the
            visible `YOUR_PLAYBACK_TOKEN` placeholder in the copyable embed
            snippet, so a preview token never leaks into what a customer copies.
          examples:
            - https://cdn.segmnt.cloud/e/vid_9xR4tL
        thumbnailUrl:
          type: string
          format: uri
          description: Signed poster/thumbnail URL for the video detail page.
    WebhookEventType:
      type: string
      enum:
        - video.ready
        - video.failed
        - video.held
        - video.removed
    WebhookEndpoint:
      type: object
      required:
        - id
        - url
        - events
        - createdAt
      properties:
        id:
          type: string
          examples:
            - whe_5mJ8kV
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    WebhookEndpointWithSecret:
      allOf:
        - $ref: '#/components/schemas/WebhookEndpoint'
        - type: object
          required:
            - signingSecret
          properties:
            signingSecret:
              type: string
              description: Use it to check `Segmnt-Signature`.
    WebhookEvent:
      type: object
      required:
        - id
        - type
        - createdAt
        - projectId
        - data
      properties:
        id:
          type: string
          description: Same for every retry of this event.
          examples:
            - evt_1qA7zP
        type:
          $ref: '#/components/schemas/WebhookEventType'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        projectId:
          type: string
        data:
          type: object
          required:
            - video
          properties:
            video:
              $ref: '#/components/schemas/Video'
            reason:
              type: string
              description: |
                Why we removed or held the video. It is set only on `video.held`
                and `video.removed`, and only when we have a reason to give.
                On `video.removed` it is `deleted_by_customer` (the customer
                deleted the video) or `plan_ended` (the video was removed 30
                days after a paid plan stopped). A legal matter never sends it.
    ProjectUsage:
      type: object
      required:
        - projectId
        - from
        - to
        - storedSeconds
        - watchedMinutes
      properties:
        projectId:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        storedSeconds:
          type: integer
          description: |
            Total stored length of the project's videos. This is what counts against
            the plan's stored-hours limit.
        watchedMinutes:
          type: integer
          description: Minutes watched by viewers in the period.
        planId:
          $ref: '#/components/schemas/PlanId'
        planStatus:
          type: string
          enum:
            - active
            - pilot
            - past_due
            - canceled
        limits:
          $ref: '#/components/schemas/PlanLimits'
        currentPeriod:
          type: object
          required:
            - start
            - end
          description: The billing month that `accountUsage` and `remaining` count.
          properties:
            start:
              $ref: '#/components/schemas/Timestamp'
            end:
              $ref: '#/components/schemas/Timestamp'
        accountUsage:
          type: object
          required:
            - storedSeconds
            - watchedMinutes
          description: Totals for all projects of the account (plan limits are per account).
          properties:
            storedSeconds:
              type: integer
            watchedMinutes:
              type: integer
        remaining:
          type: object
          required:
            - storedSeconds
            - watchedMinutes
          description: Headroom left under the plan limits. `null` means the plan has no limit. Never below `0`.
          properties:
            storedSeconds:
              type:
                - integer
                - 'null'
            watchedMinutes:
              type:
                - integer
                - 'null'
    PlanId:
      type: string
      description: Plan names and prices are subject to change. Examples are not real plans.
      examples:
        - free
    PlanLimits:
      type: object
      required:
        - storedSeconds
        - uploadSecondsPerPeriod
        - watchedMinutesPerPeriod
        - verifiedDomains
        - projects
        - maxQuality
        - whiteLabel
      description: '`null` means no limit.'
      properties:
        storedSeconds:
          type:
            - integer
            - 'null'
        uploadSecondsPerPeriod:
          type:
            - integer
            - 'null'
          description: New seconds uploaded per period (per month; over the whole window for the Pilot (by invitation) plan).
        watchedMinutesPerPeriod:
          type:
            - integer
            - 'null'
          description: |
            Included watched minutes per period. Free, Starter and Pilot (by invitation)
            playback stops at this limit; Pro and Agency continue past it and
            the extra time is billed at 5 SAR per 1,000 watched minutes before
            VAT on the next invoice.
        verifiedDomains:
          type:
            - integer
            - 'null'
        projects:
          type:
            - integer
            - 'null'
          description: Projects the account may have.
        maxQuality:
          $ref: '#/components/schemas/Quality'
        whiteLabel:
          type: boolean
          description: Can hide our logo and brand the player.
    Plan:
      type: object
      required:
        - id
        - name
        - price
        - limits
      properties:
        id:
          $ref: '#/components/schemas/PlanId'
        name:
          type: string
        price:
          type: object
          required:
            - amount
            - currency
            - interval
          description: Before VAT. VAT (15% in Saudi Arabia) is added at checkout when billing VAT mode is on.
          properties:
            amount:
              type: integer
              minimum: 0
              description: Smallest currency unit (halalas for SAR).
            currency:
              type: string
              examples:
                - SAR
            interval:
              type: string
              enum:
                - month
                - year
        limits:
          $ref: '#/components/schemas/PlanLimits'
    AccountPlan:
      type: object
      required:
        - plan
        - status
        - currentPeriod
        - limits
        - usage
      properties:
        plan:
          type: object
          required:
            - id
            - name
          properties:
            id:
              $ref: '#/components/schemas/PlanId'
            name:
              type: string
        status:
          type: string
          enum:
            - active
            - pilot
            - past_due
            - canceled
        currentPeriod:
          type: object
          required:
            - start
            - end
          properties:
            start:
              $ref: '#/components/schemas/Timestamp'
            end:
              $ref: '#/components/schemas/Timestamp'
        limits:
          $ref: '#/components/schemas/PlanLimits'
        usage:
          type: object
          description: Totals for all projects in the account in the current period.
          required:
            - storedSeconds
            - watchedMinutes
            - verifiedDomains
            - overageMinutes
          properties:
            storedSeconds:
              type: integer
            watchedMinutes:
              type: integer
            verifiedDomains:
              type: integer
            overageMinutes:
              type: integer
              description: |
                Watched minutes past the plan's included minutes in this
                period, billed at 5 SAR per 1,000 watched minutes before VAT on
                the next invoice (Pro and Agency only). `0` when under the
                limit, when the plan has no limit, or when the plan is not
                billed overage: Free, Starter and Pilot (by invitation) stop playback at the
                limit, so they always report `0`. Pro and Agency never stop
                playback at this point.
    UsageSummary:
      type: object
      required:
        - plan
        - period
        - meters
        - payAsYouGo
        - history
      properties:
        plan:
          type: object
          required:
            - id
            - name
            - status
          properties:
            id:
              $ref: '#/components/schemas/PlanId'
            name:
              type: string
            status:
              type: string
              enum:
                - active
                - pilot
                - past_due
                - canceled
        period:
          type: object
          required:
            - start
            - end
          properties:
            start:
              $ref: '#/components/schemas/Timestamp'
            end:
              $ref: '#/components/schemas/Timestamp'
        meters:
          type: array
          description: One entry per meter, always in the same order.
          items:
            $ref: '#/components/schemas/UsageMeter'
        payAsYouGo:
          type: object
          required:
            - enabled
            - cap
            - planSupportsIt
          properties:
            enabled:
              type: boolean
              description: |
                True when watch time past the included minutes is billed
                pay-as-you-go (Pro and Agency, when no pilot is active).
            cap:
              type:
                - integer
                - 'null'
              description: |
                Watched minutes at which playback stops. `null` when
                pay-as-you-go is active (no hard stop), otherwise the plan's
                included minutes.
            planSupportsIt:
              type: boolean
              description: |
                True when the plan can pay-as-you-go at all (Pro and Agency),
                even if a pilot currently turns it off.
        history:
          type: array
          description: The last three closed UTC months, oldest first.
          minItems: 3
          maxItems: 3
          items:
            type: object
            required:
              - period
              - used
            properties:
              period:
                type: object
                required:
                  - start
                  - end
                properties:
                  start:
                    $ref: '#/components/schemas/Timestamp'
                  end:
                    $ref: '#/components/schemas/Timestamp'
              used:
                type: object
                required:
                  - upload_hours
                  - processed_hours
                  - stored_hours
                  - watched_minutes
                properties:
                  upload_hours:
                    type: number
                  processed_hours:
                    type: number
                  stored_hours:
                    type: number
                    description: Reconstructed from when each video was created and (if ever) deleted. A video that later moves to `failed` drops out of past months.
                  watched_minutes:
                    type: number
    UsageMeter:
      type: object
      required:
        - meter
        - unit
        - used
        - included
        - remaining
        - percent
      properties:
        meter:
          type: string
          enum:
            - upload_hours
            - processed_hours
            - stored_hours
            - watched_minutes
        unit:
          type: string
          enum:
            - hours
            - minutes
        used:
          type: number
        included:
          type:
            - number
            - 'null'
          description: The plan's allowance for this meter, or `null` when there is no limit.
        remaining:
          type:
            - number
            - 'null'
          description: Never negative; `0` once the meter is at or over its limit. `null` when there is no limit.
        percent:
          type:
            - number
            - 'null'
          description: |
            `used / included * 100`, rounded to two decimals. Can exceed `100`
            on pay-as-you-go overage. `null` when there is no limit.
    Checkout:
      type: object
      required:
        - id
        - checkoutUrl
        - expiresAt
      properties:
        id:
          type: string
        checkoutUrl:
          type: string
          format: uri
          description: Checkout page of the payment provider.
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the checkout page stops working. `null` when the page does not
            expire.
    WhitelistJoinRequest:
      type: object
      required:
        - planId
      properties:
        planId:
          $ref: '#/components/schemas/PlanId'
        email:
          type:
            - string
            - 'null'
          maxLength: 254
          description: Optional contact address for the launch. Defaults to the account owner's e-mail when omitted.
    WhitelistEntry:
      type: object
